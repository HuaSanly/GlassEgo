enabled: true
reuse_existing: false

indices:
  object_centric_max_frames: 60
  object_centric_min_frames: 30
  reference_index: 0

pose_propagation:
  min_hand_confidence: 0.5
  # Contact falloff distance after subtracting the estimated object radius.
  grasp_distance_threshold_m: 0.20
  lock_grasp_weight: 0.60
  lock_confidence_weight: 0.10
  lock_proximity_weight: 0.30
  lock_enter_score: 0.65
  lock_exit_score: 0.45
  lock_enter_frames: 2
  lock_exit_frames: 3
  disable_kinematic_latching_left: false
  disable_kinematic_latching_right: false

dinosam:
  dino_model_id: IDEA-Research/grounding-dino-base
  box_threshold: 0.3
  sam2_repo_id: facebook/sam2-hiera-large
  sam2_checkpoint_name: sam2_hiera_large.pt
  sam2_config: sam2_hiera_l.yaml

kpts_selector:
  kpts_patch_close: true
  kpts_close_kernel: 7
  kpts_patch_erode: true
  kpts_erode_kernel: 5
  kpts_erode_iters: 1
  kpts_use_inner_edge: true
  kpts_edge_erode_kernel: 5
  kpts_min_edge_pixels: 50
  kpts_n_bands: 10

cotracker:
  cotracker_res: 640
  cotracker_chunk_size: 100
  cotracker_viz_trail_len: 20
  hf_repo_id: facebook/cotracker3
  checkpoint_name: scaled_offline.pth

triangulator:
  pose_method:
    # Add per-object overrides such as `obj_can: vlm` when semantic pose is needed.
    obj_can: vlm
    default: vlm
  vlm_crop_padding_px: 40
  vlm_remove_background: true
  step: 1
  smooth_window: 7
  smooth_polyorder: 2
  ba_f_scale: 3.0
  axes_len_m: 0.12
  point_radius_m: 0.005
  line_radius_m: 0.001

output:
  export_json: true
  export_dinosam_vis: true
  export_keypoints_vis: true
  export_tracks_vis: true
  export_gif: false
  gif_frame_ratio: 10

lama:
  enabled: true
  model:
    repo_id: Carve/LaMa-ONNX
    filename: lama_fp32.onnx
  input_size: 512
  mask_dilation: 9
  output:
    export_video: true
    export_gif: false
    gif_frame_ratio: 10

visualkpts:
  enabled: true
  visualkpts_gripper_width_max: 0.18
  visualkpts_gripper_width_min: 0.05
  visualkpts_gripper_finger_len: 0.08
  visualkpts_gripper_root_depth: 0.08
  visualkpts_radius_current: 4
  visualkpts_white_core_radius: 1
  obj_colors: [[255, 255, 0], [0, 255, 0], [255, 0, 255], [0, 0, 255]]
  output:
    export_video: true
    export_gif: false
    gif_frame_ratio: 10
