enabled: true

# Hand data is expected to be generated before phase segmentation.
hand_input:
  use_cached: true
  filename: hamer_hands.json
  required: true

# The score is heuristic until calibrated against manually labeled clips.
operation:
  feature_window_frames: 9
  linear_speed_reference_mps: 0.10
  linear_speed_scale_mps: 0.05
  angular_speed_reference_rad_s: 0.35
  angular_speed_scale_rad_s: 0.20
  linear_weight: 0.75
  angular_weight: 0.25

  hand_linear_speed_reference_mps: 0.20
  hand_linear_speed_scale_mps: 0.20
  hand_angular_speed_reference_rad_s: 0.50
  hand_angular_speed_scale_rad_s: 0.40
  min_hand_confidence: 0.30
  hand_presence_weight: 0.30
  hand_motion_weight: 0.45
  grasp_weight: 0.25
  hand_operation_weight: 0.30
  no_hand_weight: 0.35

  non_operation_enter_threshold: 0.60
  non_operation_exit_threshold: 0.35
  non_operation_enter_frames: 20
  non_operation_exit_frames: 10
  min_non_operation_frames: 25

output:
  export_json: true
  export_analysis: true
  export_video: true
  video_filename: phases_vis.mp4
