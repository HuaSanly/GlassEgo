enabled: true

detector:
  backend: auto              # auto / vitpose / mediapipe
  device: ${runtime.device}

  vitpose:
    kpt_conf_threshold: 0.3
    min_valid_kpts: 4
    bbox_pad_ratio: 0.3
    min_bbox_size_px: 20
    overlap_iou_threshold: 0.3

  mediapipe:
    num_hands: 2
    min_detection_confidence: 0.5
    min_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    bbox_pad_ratio: 0.3

hamer:
  enabled: true
  device: ${runtime.device}
  hamer_hf_repo: Leo-TX/hamer
  mano_hf_repo: warmshao/WiLoR-mini

depth_recovery:
  wrist_min_z_m: 0.05
  wrist_max_z_m: 3.0
  min_pixel_distance: 5.0
  wrist_middle_mcp_m: 0.085

grasp:
  ratio_threshold: 1.0
  fallback_distance_m: 0.105
  smooth_window: 5
  flicker_max_len: 5

postprocess:
  confidence_threshold: 0.3

  interpolation:
    enabled: true
    max_gap_frames: 3

  short_track:
    enabled: true
    min_frames: 5

trajectory:
  enabled: true
  sg_window: 9
  sg_polyorder: 2
  min_valid_frames: 15
  fill_max_gap_frames: 6
  ema_alpha_x: 0.2
  ema_alpha_y: 0.2

analysis:
  linear_velocity_limit_mps: 2.0
  angular_velocity_limit_rad_s: 10.0
